name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-pure:
    name: strict-pure (31 single-file)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run strict-pure gate
        run: sh tests/run-strict-pure.sh

  native-broad:
    name: native-broad (all examples + packages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run broad native gate
        run: sh tests/run-native-broad.sh

  optres:
    name: option/result + enums (#93)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run optres gate (builds driver from seed)
        run: sh tests/optres.sh

  match:
    name: match expressions (#91)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run match gate (builds driver from seed)
        run: sh tests/match.sh

  slices:
