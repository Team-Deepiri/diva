# Di language repo: no C sources in-tree; install uses runtime/runtime.ll or bootstrap/*.o.
name: Di integration tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (linker for hosted executables)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install di
        run: sh scripts/install.sh

      - name: Run full test suite
        run: sh tests/run.sh
